<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden; /* منع التمرير */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #container {
            text-align: center;
            width: 90%;
        }
        input {
            width: 80%;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #fff;
            background: #333;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 20px;
            outline: none;
        }
        button {
            padding: 15px 40px;
            font-size: 20px;
            background-color: #ff0000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:active {
            background-color: #cc0000;
        }
        #msg {
            margin-top: 20px;
            color: #ff4444;
            font-size: 16px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div id="container">
    <h2>أدخل الرمز للدخول</h2>
    <input type="number" id="pinInput" placeholder="أدخل الرقم هنا" autocomplete="off">
    <br>
    <button onclick="checkPin()">فتح الهاتف</button>
    <div id="msg"></div>
</div>

<script>
    const correctPin = "208201214";
    const input = document.getElementById('pinInput');
    const msg = document.getElementById('msg');

    // طلب وضع الشاشة الكاملة عند التحميل
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => {});
    }

    // منع زر الرجوع في المتصفح (للمتصفحات التي تدعم history.back)
    window.history.pushState(null, null, location.href);
    window.onpopstate = function () {
        window.history.go(1);
    };

    // الاستماع لضغط زر الرجوع (في بعض المتصفحات المخصصة)
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Backspace' || event.key === 'Escape') {
            event.preventDefault();
        }
    });

    function checkPin() {
        const val = input.value;
        if (val === correctPin) {
            // عند صحة الرقم: إغلاق الصفحة أو إعادة التوجيه
            window.location.href = "about:blank"; // أو أي رابط آخر
            // في بيئة الويب البحتة لا يمكن إغلاق النافذة تماماً إلا إذا فتحتها سكريبت، 
            // لكن هذا سيعيد الهاتف للشاشة الرئيسية أو يوقف التطبيق.
        } else {
            msg.innerText = "رمز خاطئ! حاول مرة أخرى.";
            input.value = "";
            input.focus();
        }
    }

    // منع النقر المزدوج لمنع القوائم السياقية
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    // التأكد من بقاء الشاشة مضاءة
    if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(err => {});
    }
</script>

</body>
</html>
